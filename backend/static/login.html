<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>HR Task System Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family:'Inter',sans-serif; background:#e5e7eb; }
    .login-card { box-shadow:0 10px 15px -3 rgba(0,0,0,0.1); border:1px solid #e5e7eb; }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <h1 class="text-4xl font-extrabold text-gray-900">Sign In</h1>
      <p class="mt-2 text-gray-500">Access the HR Task Management System</p>
    </div>

    <div class="login-card bg-white p-8 rounded-xl">
      <form id="loginForm" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="email" required placeholder="Enter email"
                 class="w-full border border-gray-300 rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="password" required placeholder="Enter password"
                 class="w-full border border-gray-300 rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
        </div>

        <div id="loginMessage" class="text-sm font-medium text-center h-5"></div>

        <button type="submit" class="w-full bg-indigo-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-indigo-700 transition duration-150 shadow-md">
          Login
        </button>
      </form>
    </div>
  </div>

  <script>
    // login page - sends { email, password } and stores token/user to match other pages
    async function loginUser(e){
      e.preventDefault();
      const messageDiv = document.getElementById('loginMessage');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      messageDiv.className = 'text-gray-500';
      messageDiv.textContent = 'Authenticating...';

      try {
        const res = await fetch(`${window.location.origin}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })   // <- important: send "email"
        });
        const data = await res.json();

        if (!res.ok) {
          messageDiv.className = 'text-red-600';
          messageDiv.textContent = data.message || data.msg || 'Login failed';
          return;
        }

      // after storing token & user:
      localStorage.setItem('token', data.access_token);

      // normalize role to string (handles Enum-like objects)
      let role = null;
      if (data.user) {
        if (typeof data.user.role === 'string') role = data.user.role;
        else if (data.user.role && typeof data.user.role.value === 'string') role = data.user.role.value;
        else role = String(data.user.role);
      }

      // fallback: try reading from token payload if available
      if (!role) {
        try {
          const payload = decodeJwtPayload(data.access_token);
          role = payload?.role || payload?.user_role || payload?.role?.value;
        } catch (e) { /* ignore */ }
      }

      localStorage.setItem('user', JSON.stringify(Object.assign({}, data.user, { role: role })));

      if(data.user.change_password === true){
      window.location.href = '/static/change_password.html';
      return;
      }

      messageDiv.className = 'text-green-600';
      messageDiv.textContent = `Login successful. Redirecting as ${role}...`;

      if (role === 'admin') window.location.href = '/static/admin.html';
      else if (role === 'manager') window.location.href = '/static/manager.html';
      else window.location.href = '/static/employee.html';


      } catch (err) {
        console.error(err);
        messageDiv.className = 'text-red-600';
        messageDiv.textContent = 'Network error';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', loginUser);
  </script>
</body>
</html>
