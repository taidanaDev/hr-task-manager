<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family:'Inter', sans-serif; background:#e5e7eb; }
        .card { box-shadow:0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-gray-900">Change Password</h1>
            <p class="mt-2 text-gray-500">Update your password to continue</p>
        </div>

        <div class="card bg-white p-8 rounded-xl">
            <form id="pwForm" class="space-y-6">

                <div>
                    <label for="oldpw" class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
                    <input type="password" id="oldpw" required
                           class="w-full border border-gray-300 rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label for="newpw" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <input type="password" id="newpw" required minlength="6"
                           class="w-full border border-gray-300 rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label for="conf" class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                    <input type="password" id="conf" required minlength="6"
                           class="w-full border border-gray-300 rounded-lg p-3 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div id="msg" class="h-5 text-sm text-center font-medium"></div>

                <button type="submit"
                        class="w-full bg-indigo-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-indigo-700 transition duration-150 shadow-md">
                    Update Password
                </button>

                <button type="button"
                        onclick="logout()"
                        class="mt-2 w-full bg-gray-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-gray-700 transition duration-150 shadow">
                    Logout
                </button>
            </form>
        </div>
    </div>


    <script>
        function logout(){
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "/login.html";
        }

        async function submitChangePassword(e){
            e.preventDefault();
            const msg = document.getElementById("msg");
            const oldpw = document.getElementById("oldpw").value.trim();
            const newpw = document.getElementById("newpw").value.trim();
            const conf = document.getElementById("conf").value.trim();

            msg.className = "h-5 text-sm text-center font-medium text-gray-600";
            msg.textContent = "Updating...";

            if (newpw !== conf) {
                msg.className = "h-5 text-sm text-center font-medium text-red-600";
                msg.textContent = "Passwords do not match.";
                return;
            }

            try {
                const res = await fetch("/api/auth/change-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + localStorage.getItem("token")
                    },
                    body: JSON.stringify({ old_password: oldpw, new_password: newpw })
                });

                const data = await res.json();

                if (!res.ok) {
                    msg.className = "h-5 text-sm text-center font-medium text-red-600";
                    msg.textContent = data.msg || "Error updating password.";
                    return;
                }

                // Update user stored locally
                let user = JSON.parse(localStorage.getItem("user") || "{}");
                user.change_password = false;
                localStorage.setItem("user", JSON.stringify(user));

                msg.className = "h-5 text-sm text-center font-medium text-green-600";
                msg.textContent = "Password updated successfully.";

                // Redirect user based on role
                setTimeout(() => {
                    const role = user.role;
                    if (role === "admin") window.location.href = "/static/admin.html";
                    else if (role === "manager") window.location.href = "/static/manager.html";
                    else window.location.href = "/static/employee.html";
                }, 800);

            } catch (err) {
                console.error(err);
                msg.className = "h-5 text-sm text-center font-medium text-red-600";
                msg.textContent = "Network error.";
            }
        }

        document.getElementById("pwForm").addEventListener("submit", submitChangePassword);
    </script>

</body>
</html>
